name: App version policy

on:
  pull_request:
  push:

jobs:
  app-version-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-app-version-line.test.mjs
      - run: node scripts/check-app-version-line.mjs
